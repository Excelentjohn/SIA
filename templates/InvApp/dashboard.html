<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foundly - Lost and Found Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Foundly</a>
        </div>
    </nav>

    <div class="container">
        <div class="row g-4">
            
            <!-- FORM SECTION -->
            <div class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="card-title mb-0" id="formTitle">Report / Add Item</h5>
                    </div>
                    <div class="card-body">
                        <form id="itemForm">
                            <input type="hidden" id="editIndex" value="-1">

                            <div class="mb-3">
                                <label for="item_name" class="form-label">Item Name</label>
                                <input type="text" class="form-control" id="item_name" required placeholder="e.g. Blue Umbrella">
                            </div>

                            <div class="mb-3">
                                <label for="category" class="form-label">Category</label>
                                <select class="form-select" id="category" required>
                                    <option value="" disabled selected>Select category</option>
                                    <option value="Electronics">Electronics</option>
                                    <option value="Personal Items">Personal Items</option>
                                    <option value="Books & Stationery">Books & Stationery</option>
                                    <option value="Clothing & Accessories">Clothing & Accessories</option>
                                    <option value="Others">Others</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="location" class="form-label">Location Found/Lost</label>
                                <input type="text" class="form-control" id="location" required placeholder="e.g. Library 2nd Floor">
                            </div>

                            <div class="mb-3">
                                <label for="date" class="form-label">Date</label>
                                <input type="date" class="form-control" id="date" required>
                            </div>

                            <div class="mb-3">
                                <label for="status" class="form-label">Status</label>
                                <select class="form-select" id="status" required>
                                    <option value="Lost">Lost</option>
                                    <option value="Found">Found</option>
                                    <option value="Claimed">Claimed</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="owner_name" class="form-label">Owner / Finder Name</label>
                                <input type="text" class="form-control" id="owner_name" placeholder="e.g. Juan Dela Cruz">
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" rows="3" placeholder="Provide extra details..."></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary w-100" id="saveBtn">Save Item</button>
                            <button type="button" class="btn btn-secondary w-100 mt-2 d-none" id="cancelBtn" onclick="resetForm()">Cancel Edit</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- TABLE SECTION -->
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">Lost & Found Items List</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Item Name</th>
                                        <th>Category</th>
                                        <th>Location</th>
                                        <th>Date</th>
                                        <th>Status</th>
                                        <th>Owner/Finder</th>
                                        <th class="text-center">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="itemsTableBody">
                                    <!-- Dynamic rows will appear here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT FOR CRUD -->
    <script>
        let items = JSON.parse(localStorage.getItem('foundly_items')) || [];

        function renderItems() {
            const tbody = document.getElementById('itemsTableBody');
            tbody.innerHTML = '';

            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">No lost or found items recorded yet.</td></tr>`;
                return;
            }

            items.forEach((item, index) => {
                let badgeClass = item.status === 'Lost' ? 'bg-danger' : item.status === 'Found' ? 'bg-warning text-dark' : 'bg-success';
                
                tbody.innerHTML += `
                    <tr>
                        <td>
                            <strong>${item.name}</strong><br>
                            <small class="text-muted">${item.description}</small>
                        </td>
                        <td>${item.category}</td>
                        <td>${item.location}</td>
                        <td>${item.date}</td>
                        <td><span class="badge ${badgeClass}">${item.status}</span></td>
                        <td>${item.owner}</td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-outline-primary me-1" onclick="editItem(${index})">Edit</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteItem(${index})">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        document.getElementById('itemForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const editIndex = parseInt(document.getElementById('editIndex').value);

            const newItem = {
                name: document.getElementById('item_name').value,
                category: document.getElementById('category').value,
                location: document.getElementById('location').value,
                date: document.getElementById('date').value,
                status: document.getElementById('status').value,
                owner: document.getElementById('owner_name').value,
                description: document.getElementById('description').value
            };

            if (editIndex === -1) {
                items.push(newItem);
            } else {
                items[editIndex] = newItem;
            }

            localStorage.setItem('foundly_items', JSON.stringify(items));
            resetForm();
            renderItems();
        });

        function editItem(index) {
            const item = items[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('item_name').value = item.name;
            document.getElementById('category').value = item.category;
            document.getElementById('location').value = item.location;
            document.getElementById('date').value = item.date;
            document.getElementById('status').value = item.status;
            document.getElementById('owner_name').value = item.owner;
            document.getElementById('description').value = item.description;

            document.getElementById('formTitle').innerText = 'Edit Item';
            document.getElementById('saveBtn').innerText = 'Update Item';
            document.getElementById('cancelBtn').classList.remove('d-none');
        }

        function deleteItem(index) {
            if (confirm('Are you sure you want to delete this item?')) {
                items.splice(index, 1);
                localStorage.setItem('foundly_items', JSON.stringify(items));
                renderItems();
            }
        }

        function resetForm() {
            document.getElementById('itemForm').reset();
            document.getElementById('editIndex').value = -1;
            document.getElementById('formTitle').innerText = 'Report / Add Item';
            document.getElementById('saveBtn').innerText = 'Save Item';
            document.getElementById('cancelBtn').classList.add('d-none');
        }

        renderItems();
    </script>
</body>
</html>
